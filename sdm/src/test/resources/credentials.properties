appUrl=<sample app url>
authUrl=<sample auth url>
clientID=<sample client id>
clientSecret=<sample client secret>
username=<sample username>
password=<sample password>
noSDMRoleUsername=<sample username without SDM role>
noSDMRoleUserPassword=<sample password for user without SDM role>
appUrlMT=<sample app url MT>
authUrlMTSDC=<sample auth url MT SDC>
authUrlMTGWC=<sample auth url MT GWC>
clientIDMT=<sample client id MT>
clientSecretMT=<sample client secret MT>

# ==============================================================================
# Cloud Foundry — Provider Account
# Used by: cf-update-env.sh (via CfEnvHelper.updateEnv)
# ==============================================================================

# CF API endpoint for the landscape where the provider app is deployed
# Example: https://api.cf.eu12.hana.ondemand.com
CF_API_ENDPOINT=https://api.cf.<region>.hana.ondemand.com

# CF organization that contains the provider space
CF_ORG=<your-cf-org>

# CF space where the provider application is deployed
CF_SPACE=<your-cf-space>

# SAP email address used to log in to CF (must have SpaceDeveloper role)
CF_USERNAME=<your-email@sap.com>

# CF password — leave blank to be prompted at runtime (recommended for local runs)
CF_PASSWORD=<your-cf-password>

# ==============================================================================
# Cloud Foundry — Application Environment Variable Update
# Used by: cf-update-env.sh (via CfEnvHelper.updateEnv)
# ==============================================================================

# Technical CF app name (use cf apps to look it up; typically ends in -srv)
APP_NAME=<your-app-name>-srv

# Name of the user-provided environment variable to set on the app
VAR_NAME=REPOSITORY_ID

# The new value to assign to VAR_NAME
VAR_VALUE=<new-repository-id>

# ==============================================================================
# Cloud Foundry — Consumer Account
# Used by: cf-subscribe.sh, cf-unsubscribe.sh
# Leave CONSUMER_CF_USERNAME / CONSUMER_CF_PASSWORD blank to reuse CF_USERNAME /
# CF_PASSWORD from the provider section above.
# ==============================================================================

# CF API endpoint for the consumer landscape (may differ from the provider)
CONSUMER_CF_API_ENDPOINT=https://api.cf.<region>.hana.ondemand.com

# CF organization of the consumer account
CONSUMER_CF_ORG=<consumer-cf-org>

# CF space of the consumer account
CONSUMER_CF_SPACE=<consumer-cf-space>

# Consumer credentials — leave blank to reuse CF_USERNAME / CF_PASSWORD
CONSUMER_CF_USERNAME=
CONSUMER_CF_PASSWORD=

# ==============================================================================
# BTP Subaccount Subscription
# Used by: cf-subscribe.sh, cf-unsubscribe.sh
# ==============================================================================

# GUID of the BTP consumer subaccount to subscribe
# Find it in the BTP Cockpit under Account Details
CONSUMER_SUBACCOUNT_ID=<xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx>

# Technical name of the SaaS application to subscribe to
# Example: bookshop-mt-sdmgoogleworkspacedev
SAAS_APP_NAME=<saas-app-technical-name>

# Service plan name — leave blank if the app exposes only one (default) plan
SAAS_APP_PLAN=

# Space-separated list of BTP user emails that will receive all app role collections
# Example: user1@sap.com user2@sap.com
ROLE_ASSIGNMENT_EMAILS=<user@sap.com>

# Name to give the role collection created during subscription
# Defaults to "<SAAS_APP_NAME>-Users" if left blank
ROLE_COLLECTION_NAME=

# Substring used to filter roles by appId when assigning role collections
# Defaults to SAAS_APP_NAME if left blank
APP_ROLE_FILTER=

# ==============================================================================
# BTP CLI
# Used by: cf-subscribe.sh, cf-unsubscribe.sh
# ==============================================================================

# BTP CLI server URL — use the default unless you are on a canary landscape
BTP_CLI_URL=https://cli.btp.cloud.sap

# Subdomain or GUID of the global account
# Find it in the BTP Cockpit under Account Details of the global account
BTP_GLOBAL_ACCOUNT_SUBDOMAIN=<global-account-subdomain-or-guid>

# ==============================================================================
# CMIS / SAP Document Management Service
# Used by: create.sh, get-object-id.sh, delete.sh
#
# All values are available in the SDM service instance service key.
# In the BTP Cockpit: go to your space → Service Instances → SDM instance →
# Service Keys → View → copy the JSON.
# ==============================================================================

# ECM service URL — credentials.endpoints.ecmservice.url (must end with /)
CMIS_URL=https://api-sdm-di.cfapps.<region>.hana.ondemand.com/

# Repository ID created in the SDM Admin UI (Content Management → Repositories)
CMIS_REPOSITORY_ID=<your-sdm-repository-id>

# UAA token URL — credentials.uaa.url (do NOT append /oauth/token; the script adds it)
CMIS_TOKEN_URL=https://<your-sdm-subaccount>.authentication.<region>.hana.ondemand.com

# OAuth2 client ID — credentials.uaa.clientid
CMIS_CLIENT_ID=<cmis-client-id>

# OAuth2 client secret — credentials.uaa.clientsecret
CMIS_CLIENT_SECRET=<cmis-client-secret>

# User for the OAuth2 password grant (typically the same as CF_USERNAME)
CMIS_USERNAME=<your-email@sap.com>

# Password for CMIS_USERNAME
CMIS_PASSWORD=<your-cmis-password>

# (Optional) Default CMIS parent folder object ID used by create.sh when
# no parentFolderID argument is passed from the test.
# Leave blank to upload to the repository root.
CMIS_FOLDER_ID=