name: Deploy

on:
  workflow_dispatch:
    inputs:
      cf_space:
        description: 'Specify the Cloud Foundry space to deploy to'
        required: true
      repository_id:
        description: 'Specify the Repository ID (leave blank if deploying to developcap)'
        required: false

permissions:
  pull-requests: read

jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install Cloud MTA Build Tool
        run: npm install -g mbt

      - name: Verify and Checkout Deploy Branch
        run: |
          git fetch origin
          if git rev-parse --verify origin/develop_deploy; then
            git checkout develop_deploy
          else
            echo "Branch 'develop_deploy' not found. Please verify the branch name."
            exit 1
          fi

      - name: Deleting the sdm directory for fresh build
        run: rm -rf ~/.m2/repository/com/sap/cds

      - name: Create Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOL
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
             <profiles>
                <profile>
                   <id>release.build</id>
                   <pluginRepositories>
                      <pluginRepository>
                         <id>artifactory</id>
                         <url>https://int.repositories.cloud.sap/artifactory/build-releases/</url>
                      </pluginRepository>
                   </pluginRepositories>
                   <repositories>
                      <repository>
                         <id>artifactory</id>
                         <url>https://int.repositories.cloud.sap/artifactory/build-releases/</url>
                      </repository>
                   </repositories>
                   <properties>
                      <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
                      <tycho.localArtifacts>ignore</tycho.localArtifacts>
                   </properties>
                </profile>
                <profile>
                   <id>milestone.build</id>
                   <pluginRepositories>
                      <pluginRepository>
                         <id>artifactory</id>
                         <url>https://int.repositories.cloud.sap/artifactory/build-milestones/</url>
                      </pluginRepository>
                   </pluginRepositories>
                   <repositories>
                      <repository>
                         <id>artifactory</id>
                         <url>https://int.repositories.cloud.sap/artifactory/build-milestones/</url>
                      </repository>
                   </repositories>
                   <properties>
                      <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
                      <tycho.localArtifacts>ignore</tycho.localArtifacts>
                   </properties>
                </profile>
                <profile>
                   <id>snapshot.build</id>
                   <pluginRepositories>
                      <pluginRepository>
                         <id>artifactory</id>
                         <url>https://int.repositories.cloud.sap/artifactory/build-snapshots/</url>
                      </pluginRepository>
                   </pluginRepositories>
                   <repositories>
                      <repository>
                         <id>cap-java</id>
                         <url>https://int.repositories.cloud.sap/artifactory/proxy-cap-java/</url>
                      </repository>
                      <repository>
                         <id>artifactory</id>
                         <url>https://int.repositories.cloud.sap/artifactory/build-snapshots/</url>
                      </repository>
                      <repository>
                         <id>cap-sdm-java</id>
                         <url>https://int.repositories.cloud.sap/artifactory/proxy-cap-sdm-java/</url>
                      </repository>
                   </repositories>
                   <properties>
                      <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
                      <tycho.localArtifacts>ignore</tycho.localArtifacts>
                   </properties>
                </profile>
                <profile>
                   <id>sonar</id>
                   <activation>
                      <activeByDefault>true</activeByDefault>
                   </activation>
                   <properties>
                      <sonar.host.url>https://sonar.tools.sap</sonar.host.url>
                      <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
                      <tycho.localArtifacts>ignore</tycho.localArtifacts>
                   </properties>
                </profile>
             </profiles>
             <activeProfiles>
                <activeProfile>snapshot.build</activeProfile>
             </activeProfiles>
             <pluginGroups>
                <pluginGroup>com.sap.ldi</pluginGroup>
             </pluginGroups>
             <servers>
                <server>
                   <id>artifactory</id>
                   <username>${{ secrets.SERVER_USER }}</username>
                   <password>${{ secrets.SERVER_PASSWORD }}</password>
                </server>
             </servers>
          </settings>
          EOL

      - name: Set REPOSITORY_ID
        id: set_repository_id
        run: |
          cat ~/.m2/settings.xml
          if [ "${{ github.event.inputs.cf_space }}" = "developcap" ]; then
            echo "Using REPOSITORY_ID from secrets"
            echo "::set-output name=repository_id::${{ secrets.REPOSITORY_ID }}"
          else
            if [ -z "${{ github.event.inputs.repository_id }}" ]; then
              echo "REPOSITORY_ID must be provided for non-developcap spaces"
              exit 1
            else
              echo "Using provided REPOSITORY_ID"
              echo "::set-output name=repository_id::${{ github.event.inputs.repository_id }}"
            fi
          fi

      - name: Prepare and Deploy to Cloud Foundry
        run: |
          echo "Current Branch......"
          git branch
          pwd
          cd /home/runner/work/sdm/sdm/cap-notebook/demoapp
          
          # Replace placeholder with actual REPOSITORY_ID value
          sed -i 's|__REPOSITORY_ID__|'${{ steps.set_repository_id.outputs.repository_id }}'|g' ./mta.yaml
          
          mbt build

          # Install cf CLI plugin
          cf install-plugin multiapps -f

          # Login to Cloud Foundry again to ensure session is active
          cf login -a ${{ secrets.CF_API }} -u ${{ secrets.CF_USER }} -p ${{ secrets.CF_PASSWORD }} -o ${{ secrets.CF_ORG }} -s ${{ github.event.inputs.cf_space }}

          # Deploy the application
          echo "Running cf deploy"
          cf deploy mta_archives/demoappjava_1.0.0.mtar -f
