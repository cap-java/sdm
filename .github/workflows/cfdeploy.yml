name: Build and Deploy

on:
  push:
    branches:
      - snapshot_deploy

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: develop

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      # Step 3: Update settings.xml
      - name: Update settings.xml
        run: |
          cat <<EOT > /usr/share/apache-maven-3.8.8/conf/settings.xml
<?xml version="1.0" encoding="UTF-8"?>
<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
   <profiles>
      <profile>
         <id>release.build</id>
         <pluginRepositories>
            <pluginRepository>
               <id>artifactory</id>
               <url>https://int.repositories.cloud.sap/artifactory/build-releases/</url>
            </pluginRepository>
         </pluginRepositories>
         <repositories>
            <repository>
               <id>artifactory</id>
               <url>https://int.repositories.cloud.sap/artifactory/build-releases/</url>
            </repository>
         </repositories>
         <properties>
            <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
            <tycho.localArtifacts>ignore</tycho.localArtifacts>
         </properties>
      </profile>
      <profile>
         <id>milestone.build</id>
         <pluginRepositories>
            <pluginRepository>
               <id>artifactory</id>
               <url>https://int.repositories.cloud.sap/artifactory/build-milestones/</url>
            </pluginRepository>
         </pluginRepositories>
         <repositories>
            <repository>
               <id>artifactory</id>
               <url>https://int.repositories.cloud.sap/artifactory/build-milestones/</url>
            </repository>
         </repositories>
         <properties>
            <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
            <tycho.localArtifacts>ignore</tycho.localArtifacts>
         </properties>
      </profile>
      <profile>
         <id>snapshot.build</id>
         <pluginRepositories>
            <pluginRepository>
               <id>artifactory</id>
               <url>https://int.repositories.cloud.sap/artifactory/build-snapshots/</url>
            </pluginRepository>
         </pluginRepositories>
         <repositories>
            <repository>
               <id>cap-java</id>
               <url>https://int.repositories.cloud.sap/artifactory/proxy-cap-java/</url>
            </repository>
            <repository>
               <id>artifactory</id>
               <url>https://int.repositories.cloud.sap/artifactory/build-snapshots/</url>
            </repository>
            <repository>
               <id>cap-sdm-java</id>
               <url>https://int.repositories.cloud.sap/artifactory/proxy-cap-sdm-java/</url>
            </repository>
         </repositories>
         <properties>
            <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
            <tycho.localArtifacts>ignore</tycho.localArtifacts>
         </properties>
      </profile>
      <profile>
         <id>sonar</id>
         <activation>
            <activeByDefault>true</activeByDefault>
         </activation>
         <properties>
            <sonar.host.url>https://sonar.tools.sap</sonar.host.url>
            <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
            <tycho.localArtifacts>ignore</tycho.localArtifacts>
         </properties>
      </profile>
   </profiles>
   <activeProfiles>
      <activeProfile>snapshot.build</activeProfile>
   </activeProfiles>
   <pluginGroups>
      <pluginGroup>com.sap.ldi</pluginGroup>
   </pluginGroups>
   <servers>
      <server>
         <id>artifactory</id>
         <username>${{ env.SERVER_USER }}</username>
         <password>${{ env.SERVER_PASSWORD }}</password>
      </server>
   </servers>
</settings>
EOT

      - name: Verify and Checkout Deploy Branch
        run: |
          git fetch origin
          if git rev-parse --verify origin/develop_deploy; then
            git checkout develop_deploy
          else
            echo "Branch 'develop_deploy' not found. Please verify the branch name."
            exit 1
          fi

      - name: Verify the settings.xml
        run: |
          echo "..........."
          echo "..........."
          echo "content of settings.xml"
          cat /usr/share/apache-maven-3.8.8/conf/settings.xml

      # Step 5: Run the mbt build
      - name: Run mbt build
        run: |
          pwd
          cd cap-notebook/demoapp
          # Download and install the MBT tool
          wget -P /tmp https://github.com/SAP/cloud-mta-build-tool/releases/download/v1.2.28/cloud-mta-build-tool_1.2.28_Linux_amd64.tar.gz
          tar -xvzf /tmp/cloud-mta-build-tool_1.2.28_Linux_amd64.tar.gz
          sudo mv mbt /usr/local/bin/
          mbt build
