name: Build and Deploy

on:
  push:
    branches:
      - snapshot_deploy

jobs:
  build:
    runs-on: cap-java
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: develop

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Verify and Checkout Deploy Branch
        run: |
          git fetch origin
          if git rev-parse --verify origin/develop_deploy; then
            git checkout develop_deploy
          else
            echo "Branch 'develop_deploy' not found. Please verify the branch name."
            exit 1
          fi

      - name: Run mbt build
        run: |
          pwd
          cd cap-notebook/demoapp
          mbt build

      
