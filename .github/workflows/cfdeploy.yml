name: Deploy to Cloud Foundry JAVA 17
on:
  #push:
    #branches: ["develop", "Release*", "cfdeploy"]
  pull_request:
    branches: ["develop", "Release*", "cfdeploy"]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  deploy:
    if: github.event.pull_request.merged == false
    #runs-on: cap-java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: develop
        
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
          
      - name: Login to Cloud Foundry
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install cf8-cli
          sudo cf install-plugin multiapps -f
          cf login -a ${{ secrets.CF_API }} -u ${{ secrets.CF_USER }} -p ${{ secrets.CF_PASSWORD }} -o ${{ secrets.CF_ORG }} -s ${{ secrets.CF_SPACE }}

      - name: Build and package
        run: |
          cd sdm
          pwd
          echo "Listing the content before build"
          ls -lart
          mvn clean install   
          
      - name: Verify and Checkout Deploy Branch
        run: |
          git fetch origin
          if git rev-parse --verify origin/deploy; then
            git checkout develop_deploy
          else
            echo "Branch 'develop_deploy' not found. Please verify the branch name."
            exit 1
          fi

      - name: Prepare and Deploy to Cloud Foundry
        run: |
          echo "Current Branch......"
          git branch
          cd /home/runner/work/sdm/sdm/cap-notebook/demoapp
          #cd /sapmnt/home/I355238/actions-runner_cap-java/_work/sdm/sdm/cap-notebook/demoapp/db
          #echo "running mvn clean install"
          #mvn clean install -DskipTests
          wget -P /tmp https://github.com/SAP/cloud-mta-build-tool/releases/download/v1.2.28/cloud-mta-build-tool_1.2.28_Linux_amd64.tar.gz
          tar -xvzf /tmp/cloud-mta-build-tool_1.2.28_Linux_amd64.tar.gz
          sudo mv mbt /usr/local/bin/
          #cd ..
          echo "running mbt build"
          mbt build
          pwd
          echo "Listing the content of current directory"
          ls -lart
          #echo "cf help command..."
          cf install-plugin multiapps -f
          cf login -a ${{ secrets.CF_API }} -u ${{ secrets.CF_USER }} -p ${{ secrets.CF_PASSWORD }} -o ${{ secrets.CF_ORG }} -s ${{ secrets.CF_SPACE }}
          #cf help -a
          echo "running deploy"
          cf deploy mta_archives/**.mtar -f
