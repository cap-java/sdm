name: Daily SAPUI5 Version Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-version:
    name: Check and Update SAPUI5 Version
    runs-on: ubuntu-latest
    
    
    concurrency: sapui5_version_update
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout the develop_deploy_ui5 branch
        uses: actions/checkout@v4
        with:
          ref: develop_deploy_ui5

      - name: Install dependencies
        run: |
          npm init -y
          npm install semver jsdom @octokit/action

      - name: Check and Update SAPUI5 version
        id: update_version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs').promises;
            const core = require('@actions/core');
            const semver = require('semver');
            const { JSDOM } = require('jsdom');
            const github = require('@actions/github');

            // High Priority Fix: Improved fetchWithRetry with better logging
            const fetchWithRetry = async (url, maxRetries = 5, initialDelay = 1000) => {
              let delay = initialDelay;
              for (let i = 0; i < maxRetries; i++) {
                try {
                  const response = await fetch(url);
                  if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status} - ${await response.text()}`);
                  }
                  return response;
                } catch (error) {
                  console.warn(`Attempt ${i + 1} failed. Retrying in ${delay}ms. Error:`, error.message);
                  await new Promise(resolve => setTimeout(resolve, delay));
                  delay *= 2;
                }
              }
              throw new Error(`Failed to fetch ${url} after ${maxRetries} retries.`);
            };

            const sapui5Url = 'https://ui5.sap.com/resources/sap-ui-version.json';
            const filePath = 'cap-notebook/demoapp/app/index.html';
            const { GITHUB_TOKEN } = process.env;
            const octokit = github.getOctokit(GITHUB_TOKEN);
            const { owner, repo } = github.context.repo;

            let latestVersion, currentVersion;

            try {
              const response = await fetchWithRetry(sapui5Url);
              const data = await response.json();
              if (!data.version) {
                throw new Error('Could not find a version field in the API response.');
              }
              latestVersion = data.version;
              console.log(`Latest SAPUI5 version found: ${latestVersion}`);
            } catch (error) {
              core.setFailed(`Error fetching SAPUI5 version: ${error.message}`);
              return;
            }

            try {
              const fileContent = await fs.readFile(filePath, 'utf8');
              const dom = new JSDOM(fileContent);
              const scriptTag = dom.window.document.querySelector('script[src*="sap-ui-core.js"]');
              if (!scriptTag) {
                throw new Error('SAPUI5 script tag not found in the HTML file.');
              }
              const src = scriptTag.getAttribute('src');
              const match = src.match(/https:\/\/ui5.sap.com\/(.*?)\/resources\/sap-ui-core.js/);
              if (!match || !match[1]) {
                throw new Error('Could not parse current version from script tag.');
              }
              currentVersion = match[1];
              console.log(`Current SAPUI5 version in file: ${currentVersion}`);
            } catch (error) {
              core.setFailed(`Error reading or parsing HTML file: ${error.message}`);
              return;
            }

            if (semver.gt(latestVersion, currentVersion)) {
              console.log(`A newer version is available. Updating ${currentVersion} -> ${latestVersion}`);
              
              const baseBranch = github.context.payload.pull_request ? github.context.payload.pull_request.base.ref : 'develop_deploy';
              const branchName = 'automated/sapui5-version-update';
              
              try {
                  // Create a new branch
                  await octokit.rest.git.createRef({
                    owner,
                    repo,
                    ref: `refs/heads/${branchName}`,
                    sha: github.context.sha,
                  });
              } catch (e) {
                  console.log(`Branch ${branchName} may already exist. Continuing...`);
              }
              
              const fileContent = await fs.readFile(filePath, 'utf8');
              const dom = new JSDOM(fileContent);
              const scriptTag = dom.window.document.querySelector('script[src*="sap-ui-core.js"]');
              const newSrc = scriptTag.getAttribute('src').replace(currentVersion, latestVersion);
              scriptTag.setAttribute('src', newSrc);
              const updatedContent = dom.serialize();

              await fs.writeFile(filePath, updatedContent);
              
              // Commit the changes
              await octokit.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: filePath,
                  message: `chore: Update SAPUI5 to ${latestVersion}`,
                  content: Buffer.from(updatedContent).toString('base64'),
                  branch: branchName,
                  sha: (await octokit.rest.repos.getContent({ owner, repo, path: filePath, ref: branchName })).data.sha
              });

              // Create the pull request
              const pr = await octokit.rest.pulls.create({
                  owner,
                  repo,
                  head: branchName,
                  base: baseBranch,
                  title: `Automated: Update SAPUI5 to ${latestVersion}`,
                  body: `This is an automated pull request to update the SAPUI5 version in \`${filePath}\`.
                        - Current Version: ${currentVersion}
                        - Latest Version: ${latestVersion}`
              });

              console.log(`Pull request created: ${pr.data.html_url}`);
              core.setOutput('pr_created', 'true');
              core.setOutput('pr_url', pr.data.html_url);

            } else {
              console.log('No update needed. Current version is the latest.');
              core.setOutput('pr_created', 'false');
            }
