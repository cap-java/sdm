name: Daily SAPUI5 Version Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-version:
    name: Check and Update SAPUI5 Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout the develop_deploy branch
        uses: actions/checkout@v3
        with:
          ref: develop_deploy

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl

      - name: Run version update script
        id: run_script
        run: |
          #!/bin/bash
          
          # Define the target file
          FILE_PATH="cap-notebook/demoapp/app/index.html"
          
          # Fetch the latest version using jq for robust parsing
          LATEST_VERSION=$(curl -s "https://sapui5.hana.ondemand.com/resources/sap-ui-version.json" | jq -r '.version')
          
          echo "Latest SAPUI5 version found: $LATEST_VERSION"
          
          # Fetch the current version from the specified file
          CURRENT_VERSION=$(grep 'sap-ui-core' "$FILE_PATH" | sed -E 's|.*hana\.ondemand\.com/||' -E 's|/resources.*||')
          
          echo "Current SAPUI5 version in file: $CURRENT_VERSION"
          
          # Split versions into components for numerical comparison
          IFS='.' read -r LATEST_MAJOR LATEST_MINOR LATEST_PATCH <<< "$LATEST_VERSION"
          IFS='.' read -r CURRENT_MAJOR CURRENT_MINOR CURRENT_PATCH <<< "$CURRENT_VERSION"
          
          echo "Comparing versions: $CURRENT_VERSION vs $LATEST_VERSION"
          
          # Perform numerical comparison
          if (( LATEST_MAJOR > CURRENT_MAJOR || \
                (LATEST_MAJOR == CURRENT_MAJOR && LATEST_MINOR > CURRENT_MINOR) || \
                (LATEST_MAJOR == CURRENT_MAJOR && LATEST_MINOR == CURRENT_MINOR && LATEST_PATCH > CURRENT_PATCH) )); then
              
              echo "A newer version of SAPUI5 is available. Updating..."
              
              # Use a safe sed replacement with a different delimiter to avoid conflicts with version numbers
              sed -i "s|${CURRENT_VERSION}|${LATEST_VERSION}|g" "$FILE_PATH"
              
              echo "Update successful."
              
              # Set output to trigger the PR creation
              echo "changes_made=true" >> "$GITHUB_OUTPUT"
              echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          else
              echo "Current version is up-to-date. No changes needed."
          fi
        shell: bash

      - name: Create Pull Request
        if: steps.run_script.outputs.changes_made == 'true'
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          commit-message: 'chore: Update SAPUI5 to ${{ steps.run_script.outputs.latest_version }}'
          title: 'Automated: Update SAPUI5 to ${{ steps.run_script.outputs.latest_version }}'
          body: |
            This is an automated pull request to update the SAPUI5 version in `index.html`.
            - Current Version: ${{ steps.get_current_version.outputs.current_version }}
            - Latest Version: ${{ steps.run_script.outputs.latest_version }}
          branch: 'update-sapui5-version'
          base: develop_deploy
          assignees: yashmeet29
