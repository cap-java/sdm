name: AI Code Review with SAP AI Core

on:
  pull_request:
    types: [opened, synchronize]
    branches: [sap-ai-core-review]
  push:
    branches: [sap-ai-core-review]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd .github/scripts
          npm install
      
      - name: Run AI Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AICORE_AUTH_URL: ${{ secrets.AICORE_AUTH_URL }}
          AICORE_CLIENT_ID: ${{ secrets.AICORE_CLIENT_ID }}
          AICORE_CLIENT_SECRET: ${{ secrets.AICORE_CLIENT_SECRET }}
          AICORE_RESOURCE_GROUP: "default"
          AICORE_BASE_URL: ${{ secrets.AICORE_BASE_URL }}
          # Optional: Configure retry and chunking parameters
          MAX_RETRIES: 5
          INITIAL_DELAY_MS: 1000
          MAX_CHUNK_TOKENS: 10000
          MAX_SEMANTIC_ISSUES: 150
        run: |
          cd .github/scripts
          node review.js
