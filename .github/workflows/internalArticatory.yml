name: Internal Artifactory snapshot deploy

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.6.3'
  ARTIFACTORY_URL: 'https://common.repositories.cloud.sap/artifactory/cap-sdm-java'

on:
  push:
    branches: [ 'develop', 'internal-repo' ]
  workflow_dispatch:

jobs:
  build-and-deploy-artifactory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: sapmachine
          cache: maven

      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Read current revision
        id: read-revision
        run: |
          current_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "Current version: $current_version"
          echo "REVISION=$current_version" >> $GITHUB_ENV
          # Seed UPDATED_VERSION for later condition even if bump skipped
          echo "UPDATED_VERSION=$current_version" >> $GITHUB_ENV

      - name: Bump version if needed
        id: bump-version
        if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/internal-repo' }}
        run: |
          current_version="${{ env.REVISION }}"
          if [[ $current_version != *-SNAPSHOT ]]; then
            echo "Version lacks -SNAPSHOT; incrementing patch."
            IFS='.' read -r major minor patch <<< "$(echo $current_version | tr '-' '.')"
            new_patch=$((patch + 1))
            new_version="${major}.${minor}.${new_patch}-SNAPSHOT"
            sed -i "s|<revision>.*</revision>|<revision>${new_version}</revision>|" pom.xml
            echo "Updated version to $new_version"
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add pom.xml
            branch_name="${GITHUB_REF#refs/heads/}"
            git commit -m "Increment version to ${new_version}" || echo "No changes to commit"
            git push origin HEAD:"${branch_name}"
          else
            echo "Already a -SNAPSHOT version; no bump performed."
          fi
          updated_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "UPDATED_VERSION=$updated_version" >> $GITHUB_ENV

      - name: Generate Maven settings with Artifactory server
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>artifactory</id>
                <username>${env.CAP_DEPLOYMENT_USER}</username>
                <password>${env.CAP_DEPLOYMENT_PASS}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          CAP_DEPLOYMENT_USER: ${{ secrets.CAP_DEPLOYMENT_USER }}
          CAP_DEPLOYMENT_PASS: ${{ secrets.CAP_DEPLOYMENT_PASS }}

      - name: Deploy snapshot to Artifactory
        if: ${{ endsWith(env.UPDATED_VERSION, '-SNAPSHOT') }}
        run: |
          echo "Deploying ${UPDATED_VERSION} to Artifactory"
          mvn -s $HOME/.m2/settings.xml -B -ntp -fae \
            -Dmaven.install.skip=true -Dmaven.test.skip=true -DdeployAtEnd=true \
            -DaltDeploymentRepository=artifactory::default::${{ env.ARTIFACTORY_URL }} deploy
        env:
          UPDATED_VERSION: ${{ env.UPDATED_VERSION }}
          CAP_DEPLOYMENT_USER: ${{ secrets.CAP_DEPLOYMENT_USER }}
          CAP_DEPLOYMENT_PASS: ${{ secrets.CAP_DEPLOYMENT_PASS }}

      - name: Verify artifact in Artifactory
        if: ${{ endsWith(env.UPDATED_VERSION, '-SNAPSHOT') }}
        run: |
          group_path="com/sap/cds/sdm"
          version="${{ env.UPDATED_VERSION }}"
          # Attempt to fetch maven-metadata to confirm deployment
          curl -u "${{ secrets.CAP_DEPLOYMENT_USER }}:${{ secrets.CAP_DEPLOYMENT_PASS }}" -f -I \
            "$ARTIFACTORY_URL/$group_path/$version/maven-metadata.xml" || exit 1
          echo "Artifact metadata accessible for $version"

      - name: Summary
        run: |
          echo "Revision: ${{ env.REVISION }}"
          echo "Final version: ${{ env.UPDATED_VERSION }}"
          echo "Deployment target: ${{ env.ARTIFACTORY_URL }}"
