name: Gemini AI Issue Summarizer

on:
  # This workflow now triggers when a new issue is opened
  issues:
    types: [opened]

jobs:
  summarize:
    # Ensure the job only runs for new issues and not from the bot itself
    if: github.event.issue.author.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd .github/scripts
          npm install

      - name: Run AI Issue Summarizer Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AICORE_SERVICE_KEY: ${{ secrets.AICORE_SERVICE_KEY }}
        run: |
          cd .github/scripts
          node review.js
