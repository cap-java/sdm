######
name: Main build and snapshot deploy

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.6.3'

on:
  push:
    #branches: [ "SDMEXT-1046" ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 17 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java-version }}
          maven-version: ${{ env.MAVEN_VERSION }}

  update-version:
    name: Update version
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: sapmachine
          cache: maven

      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Get Current Version
        id: get-current-version
        run: |
          current_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version: $current_version"
          echo "REVISION=$current_version" >> $GITHUB_ENV
        shell: bash

      - name: Create Branch and Update Version
        id: create-branch-and-update-version
        run: |
          current_version=${{ env.REVISION }}
          # Check if the version already contains '-SNAPSHOT'
          branch_name="update-version-${{ github.sha }}"
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git checkout -b $branch_name
          if [[ $current_version != *-SNAPSHOT ]]; then
            echo "Current version does not contain -SNAPSHOT, updating version..."
            IFS='.' read -r major minor patch <<< "$(echo $current_version | tr '-' '.')"
            new_patch=$((patch + 1))
            new_version="${major}.${minor}.${new_patch}-SNAPSHOT"
            sed -i "s|<revision>.*</revision>|<revision>${new_version}</revision>|" pom.xml
            echo "Updated version to $new_version"
            git add pom.xml
            git commit -m "Increment version to ${new_version}"
          else
            echo "Current version already contains -SNAPSHOT, no update needed."
          fi
          updated_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          git push origin HEAD:$branch_name
          echo "UPDATED_VERSION=$updated_version" >> $GITHUB_ENV
        shell: bash

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v4
        with:
          commit-message: 'Increment version to ${{ env.UPDATED_VERSION }}'
          branch: ${{ steps.create-branch-and-update-version.outputs.branch_name }}
          title: 'Increment version to ${{ env.UPDATED_VERSION }}'
          body: 'Updating version to ${{ env.UPDATED_VERSION }}'
          labels: 'automerge'

      - name: Print Updated Version
        run: |
          echo "Updated version: ${{ env.UPDATED_VERSION }}"
        shell: bash
        
      - name: Deploy snapshot
        if: ${{ endsWith(env.UPDATED_VERSION, '-SNAPSHOT') }}
        run: |
          mvn -B -ntp -fae -Dmaven.install.skip=true -Dmaven.test.skip=true -DdeployAtEnd=true deploy
        env:
          CAP_DEPLOYMENT_USER: ${{ secrets.CAP_DEPLOYMENT_USER }}
          CAP_DEPLOYMENT_PASS: ${{ secrets.CAP_DEPLOYMENT_PASS }}
        shell: bash
########
