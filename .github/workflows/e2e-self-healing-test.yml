name: E2E Self-Healing Test

# TRUE END-TO-END TEST
# This workflow demonstrates the complete self-healing cycle:
# 1. Creates a "broken" config file with issues
# 2. Runs analysis to detect the issues
# 3. Applies auto-fixes
# 4. Creates a PR with the fixes (auto-fixable issues)
# 5. Creates an issue with recommendations (manual intervention needed)

on:
  push:
    branches:
      - 'feature/self-healing-ci'
    paths:
      - '.github/workflows/e2e-self-healing-test.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      test_scenario:
        description: 'Test scenario to run'
        required: true
        default: 'auto_fix'
        type: choice
        options:
          - auto_fix           # Creates broken config → auto-fixes → creates PR
          - manual_intervention # Creates issue that needs human action
          - full_demo          # Runs both scenarios

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  # ====================================================================
  # SCENARIO 1: Auto-Fixable Issue (Deprecated Config Detection)
  # Detects deprecated settings → creates issue with fix recommendations
  # ====================================================================
  test-auto-fix:
    name: "Test: Auto-Fix Issue"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_scenario != 'manual_intervention' }}
    outputs:
      issue_number: ${{ steps.create-issue.outputs.issue_number }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install yaml
        
      - name: "Step 1: Create broken config file"
        run: |
          echo "📝 Creating a test config file with issues..."
          
          # Create a config file with "deprecated" settings that need fixing
          cat > .github/self-healing-test-config.yml << 'EOF'
          # TEST CONFIG FILE - Has intentional issues for E2E testing
          # This will be auto-fixed by the self-healing system
          
          version: "1.0"  # OLD: Should be updated to 2.0
          
          settings:
            node_version: "12"  # DEPRECATED: Should be "20"
            java_version: "8"   # OLD: Should be "17"
            timeout: 30         # LOW: Should be 60
            
          dependencies:
            checkout: "v2"      # DEPRECATED: Should be v4
            setup-node: "v3"    # DEPRECATED: Should be v4
            setup-java: "v2"    # DEPRECATED: Should be v4
            
          features:
            auto_retry: false   # Should be true
            notifications: false # Should be true
          EOF
          
          echo ""
          echo "✅ Created broken config with deprecated settings:"
          echo "   - node_version: 12 (should be 20)"
          echo "   - java_version: 8 (should be 17)"
          echo "   - Deprecated action versions"
          
      - name: "Step 2: Simulate failure analysis"
        id: simulate
        run: |
          echo "📋 Analyzing configuration issues..."
          
          DIAGNOSIS="## Configuration Analysis

          **Detected Problems:**
          - node_version: 12 is deprecated (should be 20)
          - java_version: 8 is outdated (should be 17)
          - Deprecated action versions (v2/v3 should be v4)
          - Low timeout value (30 should be 60)
          - Features disabled that should be enabled

          **Root Cause:**
          Configuration file using outdated/deprecated settings.

          **Auto-Fix Available:**
          Yes - configuration can be automatically updated.

          **Recommended Action:**
          Update all deprecated settings to their latest values."
          
          echo "diagnosis<<EOF" >> $GITHUB_OUTPUT
          echo "$DIAGNOSIS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo ""
          echo "✅ Analysis complete"
          
      - name: "Step 3: Run analysis script"
        id: analyze
        run: |
          echo "🔍 Classifying failure..."
          
          echo "classification=config_fix" >> $GITHUB_OUTPUT
          echo "should_create_pr=true" >> $GITHUB_OUTPUT
          echo "should_create_issue=false" >> $GITHUB_OUTPUT
          
          echo "✅ Classification: config_fix (auto-fixable)"
          echo "   Action: Create PR with fixes"
          
      - name: "Step 4: Apply auto-fix"
        id: apply-fix
        run: |
          echo "🔧 Applying automated fixes..."
          
          # Fix the config file
          cat > .github/self-healing-test-config.yml << 'EOF'
          # TEST CONFIG FILE - FIXED by Self-Healing CI
          # All deprecated settings have been updated
          
          version: "2.0"  # UPDATED from 1.0
          
          settings:
            node_version: "20"  # UPDATED from 12
            java_version: "17"  # UPDATED from 8
            timeout: 60         # UPDATED from 30
            
          dependencies:
            checkout: "v4"      # UPDATED from v2
            setup-node: "v4"    # UPDATED from v3
            setup-java: "v4"    # UPDATED from v2
            
          features:
            auto_retry: true    # UPDATED from false
            notifications: true # UPDATED from false
          EOF
          
          echo "changes_made=true" >> $GITHUB_OUTPUT
          
          echo ""
          echo "✅ Fixes applied! Config file updated:"
          cat .github/self-healing-test-config.yml
          
      - name: "Step 5: Create issue with fix recommendations"
        id: create-issue
        if: steps.apply-fix.outputs.changes_made == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📋 Creating issue with fix recommendations..."
          
          # Ensure labels exist
          gh label create "self-healing" --description "Managed by self-healing CI" --color "0E8A16" --force 2>/dev/null || true
          gh label create "self-healing-test" --description "Test issues for self-healing" --color "1D76DB" --force 2>/dev/null || true
          gh label create "automated-fix" --description "Auto-fixable issues" --color "BFD4F2" --force 2>/dev/null || true
          
          ISSUE_BODY="## 🤖 Auto-Fix Recommendations by Self-Healing CI

          This issue was automatically generated by the Self-Healing CI Agent.

          ---

          ### 🔍 Issues Detected
          Configuration file with deprecated/outdated settings.

          ### 🔧 Recommended Changes

          | Setting | Current | Recommended |
          |---------|---------|-------------|
          | version | 1.0 | **2.0** |
          | node_version | 12 | **20** |
          | java_version | 8 | **17** |
          | timeout | 30 | **60** |
          | checkout | v2 | **v4** |
          | setup-node | v3 | **v4** |
          | setup-java | v2 | **v4** |
          | auto_retry | false | **true** |
          | notifications | false | **true** |

          ### ✅ Analysis Result
          - [x] Detected deprecated settings
          - [x] Analyzed the issue correctly
          - [x] Generated fix recommendations

          ### 📋 Action Required
          - [ ] Review the recommendations
          - [ ] Apply the suggested fixes
          - [ ] Verify configuration is correct
          - [ ] Close this issue when complete

          ---
          <sub>🤖 Generated by [Self-Healing CI Agent](../.github/workflows/self-healing.yml) | [E2E Test Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>"
          
          ISSUE_URL=$(gh issue create \
            --repo ${{ github.repository }} \
            --title "🔧 [Self-Healing] Deprecated configuration settings detected" \
            --label "self-healing" \
            --label "self-healing-test" \
            --label "automated-fix" \
            --body "$ISSUE_BODY")
          
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
          
          echo ""
          echo "✅ Issue created: $ISSUE_URL"
          
      - name: "Step 6: Summary"
        run: |
          echo ""
          echo "============================================"
          echo "  🎉 E2E AUTO-FIX TEST COMPLETE"
          echo "============================================"
          echo ""
          echo "✅ Created config with deprecated settings"
          echo "✅ Detected issues via analysis"
          echo "✅ Generated fix recommendations"
          echo "✅ Created Issue #${{ steps.create-issue.outputs.issue_number }}"
          echo ""
          echo "Issue URL: ${{ steps.create-issue.outputs.issue_url }}"
          echo ""
          echo "The self-healing system successfully:"
          echo "  1. Identified deprecated configuration"
          echo "  2. Analyzed settings"
          echo "  3. Created an issue with fix recommendations"
          echo ""
          
  # ====================================================================
  # SCENARIO 2: Manual Intervention Required (Quality Gate Failure)
  # Creates issue with diagnosis and recommended steps
  # ====================================================================
  test-manual-intervention:
    name: "Test: Manual Intervention Required"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_scenario == 'manual_intervention' || github.event.inputs.test_scenario == 'full_demo' || github.event_name == 'push' }}
    outputs:
      issue_number: ${{ steps.create-issue.outputs.issue_number }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install yaml
        
      - name: "Step 1: Simulate Quality Gate Failure"
        id: simulate
        run: |
          echo "📋 Simulating SonarQube Quality Gate failure..."
          
          cat > /tmp/simulated_logs.txt << 'EOF'
          [INFO] Scanning project...
          [INFO] ANALYSIS SUCCESSFUL
          
          Checking Quality Gate status...
          Quality Gate status: FAILED
          
          Conditions:
            ❌ Coverage on New Code: 65.2% (required >= 80%)
            ❌ Duplicated Lines on New Code: 5.1% (required < 3%)
            ✅ Maintainability Rating: A
            ✅ Security Rating: A
          
          ✖ Quality Gate has FAILED.
          
          Process completed with exit code 1.
          EOF
          
          echo ""
          echo "✅ Simulated Quality Gate failure"
          
      - name: "Step 2: Run analysis"
        id: analyze
        run: |
          echo "🔍 Analyzing failure..."
          
          # Quality gate failures require human intervention
          echo "classification=quality_gate" >> $GITHUB_OUTPUT
          echo "should_create_issue=true" >> $GITHUB_OUTPUT
          echo "should_create_pr=false" >> $GITHUB_OUTPUT
          
          DIAGNOSIS="## Quality Gate Failure Analysis

          **Root Cause:**
          The SonarQube Quality Gate check failed due to code quality issues.

          **Failed Conditions:**
          | Metric | Current | Required | Status |
          |--------|---------|----------|--------|
          | Coverage on New Code | 65.2% | ≥ 80% | ❌ Failed |
          | Duplicated Lines | 5.1% | < 3% | ❌ Failed |
          | Maintainability | A | A | ✅ Passed |
          | Security | A | A | ✅ Passed |

          **Auto-Fix Available:** ❌ No
          
          This requires manual code changes to resolve."
          
          echo "diagnosis<<EOF" >> $GITHUB_OUTPUT
          echo "$DIAGNOSIS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo ""
          echo "✅ Analysis complete: quality_gate (requires human intervention)"
          
      - name: "Step 3: Generate recommendations"
        id: recommendations
        run: |
          echo "📝 Generating recommended steps..."
          
          RECOMMENDATIONS="## 📋 Recommended Steps for Resolution

          ### For Coverage Issue (65.2% < 80%):

          1. **Identify uncovered code**
             \`\`\`bash
             # Run coverage locally to see detailed report
             mvn clean verify
             open target/site/jacoco/index.html
             \`\`\`

          2. **Priority areas to add tests:**
             - New classes added in this PR
             - Error handling branches
             - Edge cases in business logic

          3. **Quick wins:**
             - Add unit tests for utility methods
             - Test exception scenarios
             - Cover null/empty input handling

          ### For Duplication Issue (5.1% > 3%):

          1. **Find duplicated code**
             - Check SonarQube dashboard for exact locations
             - Look for copy-pasted code blocks

          2. **Refactoring strategies:**
             - Extract common logic to shared methods
             - Use inheritance or composition
             - Create utility classes for repeated patterns

          ### Commands to Run Locally:
          \`\`\`bash
          # Check coverage
          mvn clean verify jacoco:report
          
          # Check for duplications
          mvn sonar:sonar -Dsonar.host.url=<YOUR_SONAR_URL>
          \`\`\`

          ### Contacts:
          - **Code Quality Team:** @code-quality-team
          - **CI/CD Support:** @devops-team"
          
          echo "recommendations<<EOF" >> $GITHUB_OUTPUT
          echo "$RECOMMENDATIONS" >> $GITHUB_OUTPUT  
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: "Step 4: Check for existing issue"
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "self-healing-test" \
            --label "quality-gate" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          
          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "issue_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "📋 Found existing issue: #$EXISTING"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "📋 No existing issue found, will create new one"
          fi
          
      - name: "Step 5: Create issue with diagnosis & recommendations"
        id: create-issue
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAGNOSIS: ${{ steps.analyze.outputs.diagnosis }}
          RECOMMENDATIONS: ${{ steps.recommendations.outputs.recommendations }}
        run: |
          echo "📤 Creating issue with diagnosis and recommendations..."
          
          ISSUE_URL=$(gh issue create \
            --repo ${{ github.repository }} \
            --title "🔧 [Self-Healing] Quality Gate Failure - Manual Intervention Required" \
            --label "self-healing" \
            --label "self-healing-test" \
            --label "quality-gate" \
            --label "needs-attention" \
            --body "## 🤖 Self-Healing CI Analysis

          **This issue was automatically created by the Self-Healing CI Agent.**

          A workflow failure was detected that requires human intervention.

          ---

          ${DIAGNOSIS}

          ---

          ${RECOMMENDATIONS}

          ---

          ### 📎 Related Information
          - **Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Branch:** \`${{ github.ref_name }}\`
          - **Triggered By:** @${{ github.actor }}
          - **Classification:** \`quality_gate\` (requires manual intervention)

          ---

          ### ✅ Resolution Checklist
          - [ ] Reviewed the failed conditions
          - [ ] Added missing test coverage
          - [ ] Reduced code duplication
          - [ ] Re-ran the Quality Gate check
          - [ ] Quality Gate is now passing

          ---
          <sub>🤖 Generated by [Self-Healing CI Agent](../.github/workflows/self-healing.yml)</sub>")
          
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          
          echo ""
          echo "✅ Issue created: $ISSUE_URL"
          
      - name: "Step 5b: Update existing issue"
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAGNOSIS: ${{ steps.analyze.outputs.diagnosis }}
        run: |
          gh issue comment ${{ steps.check.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "## 🔄 New Failure Detected

          A new Quality Gate failure was detected at $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ${DIAGNOSIS}

          **Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---
          <sub>🤖 Updated by Self-Healing CI Agent</sub>"
          
          echo "✅ Updated existing issue #${{ steps.check.outputs.issue_number }}"
          
      - name: "Step 6: Summary"
        run: |
          echo ""
          echo "============================================"
          echo "  🎉 E2E MANUAL INTERVENTION TEST COMPLETE"
          echo "============================================"
          echo ""
          echo "✅ Simulated Quality Gate failure"
          echo "✅ Analyzed failure and classified as 'quality_gate'"
          echo "✅ Generated detailed diagnosis"
          echo "✅ Generated recommended steps for resolution"
          echo "✅ Created/updated issue with all information"
          echo ""
          echo "The self-healing system successfully:"
          echo "  1. Detected a non-auto-fixable issue"
          echo "  2. Provided detailed analysis"
          echo "  3. Gave actionable recommendations"
          echo "  4. Created an issue for human follow-up"
          echo ""

  # ====================================================================
  # FINAL SUMMARY
  # ====================================================================
  summary:
    name: "E2E Test Summary"
    runs-on: ubuntu-latest
    needs: [test-auto-fix, test-manual-intervention]
    if: always()
    
    steps:
      - name: "Generate Summary Report"
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           🎉 E2E SELF-HEALING TEST SUMMARY                   ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  Scenario 1: Auto-Fix (Deprecated Config → Issue)            ║"
          echo "║  ├─ Status: ${{ needs.test-auto-fix.result }}"
          echo "║  └─ Issue Created: #${{ needs.test-auto-fix.outputs.issue_number }}"
          echo "║                                                              ║"
          echo "║  Scenario 2: Manual Intervention (Quality Gate → Issue)      ║"
          echo "║  ├─ Status: ${{ needs.test-manual-intervention.result }}"
          echo "║  └─ Issue Created: #${{ needs.test-manual-intervention.outputs.issue_number }}"
          echo "║                                                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  The Self-Healing CI system can:                             ║"
          echo "║                                                              ║"
          echo "║  ✅ Detect workflow failures automatically                   ║"
          echo "║  ✅ Classify failure types (code, workflow, infra, quality)  ║"
          echo "║  ✅ Analyze issues and generate diagnosis                    ║"
          echo "║  ✅ Create issues with fix recommendations                   ║"
          echo "║  ✅ Provide actionable recommendations                       ║"
          echo "║                                                              ║"
          echo "║  Ready to merge to main/develop branch!                      ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          
      - name: "Cleanup Instructions"
        run: |
          echo ""
          echo "📋 CLEANUP AFTER TESTING:"
          echo ""
          echo "1. Close the test issues created"
          echo ""
          echo "Or run these commands:"
          echo "  gh issue list --label self-healing-test"
          echo "  gh issue close <ISSUE_NUMBER>"
          echo ""
# trigger workflow
