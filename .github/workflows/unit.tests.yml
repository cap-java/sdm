name: UnitTestsWithCodeCoverageTestAK

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    types: [opened, synchronize, reopened, auto_merge_enabled]
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL of the file to download and verify'
        required: true
        default: 'http://www.eicar.org/download/eicar.com.txt'
        type: string
      download_path:
        description: 'Local path/filename to save the downloaded file'
        required: false
        default: 'eicar.com.txt'
        type: string

jobs:
  download-and-verify:
    runs-on: ubuntu-latest
    steps:
    - name: Download file from URL
      if: github.event_name == 'workflow_dispatch'
      run: |
        curl -fSL \
          "${{ github.event.inputs.file_url }}" \
          -o "${{ github.event.inputs.download_path }}"

    - name: Wait 30 seconds
      if: github.event_name == 'workflow_dispatch'
      run: sleep 30

    - name: Verify downloaded file
      if: github.event_name == 'workflow_dispatch'
      run: |
        FILE="${{ github.event.inputs.download_path }}"
        if [ -f "$FILE" ]; then
          FILE_NAME=$(basename "$FILE")
          FILE_SIZE=$(stat -c '%s' "$FILE")
          echo "File exists"
          echo "Name : $FILE_NAME"
          echo "Size : $FILE_SIZE bytes"
        else
          echo "File NOT found at path: $FILE"
          exit 1
        fi

    - name: PR build check
      if: github.event_name != 'workflow_dispatch'
      run: echo "Workflow triggered by ${{ github.event_name }} on branch ${{ github.ref }}"
