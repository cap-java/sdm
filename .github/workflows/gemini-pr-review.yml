# This workflow uses the Gemini API to review pull requests and issues.

name: Gemini PR Reviewer

on:
  # This section defines when the workflow will run.
  # We want it to run on new pull requests and when issues are opened.
  pull_request:
    types: [opened, reopened, edited, synchronize]
  issues:
    types: [opened, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    
    # We need to grant permissions for the workflow to read the PR/issue
    # and to write comments.
    permissions:
      contents: read
      pull-requests: write
      issues: write

