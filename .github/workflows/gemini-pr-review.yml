name: Gemini AI PR Reviewer
on:
  # This triggers the bot only when a comment is created on an issue or pull request.
  issue_comment:
    types: [created]

jobs:
  review:
    # Ensure this job only runs if the comment was made on a Pull Request
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd .github/scripts
          npm install
      - name: Run AI PR Review Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AICORE_SERVICE_KEY: ${{ secrets.AICORE_SERVICE_KEY }}
        run: |
          cd .github/scripts
          node review.js
