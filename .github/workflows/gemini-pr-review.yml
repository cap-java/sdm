# This workflow uses the Gemini API to review pull requests and issues.

name: Gemini PR Reviewer

on:
  # This section defines when the workflow will run.
  # We want it to run on new pull requests and when issues are opened.
  pull_request:
    types: [opened, reopened, edited, synchronize]
  issues:
    types: [opened, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    
    # We need to grant permissions for the workflow to read the PR/issue
    # and to write comments.
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # This step will install the dependencies for our custom script.
      # We will use a Node.js environment for simplicity.
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install @actions/github @google/generative-ai

      # This is the custom script that interacts with the Gemini API.
      - name: Run Gemini Reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # The script is now saved to a file and then executed with 'node'.
          # This is the correct way to run a Node.js script in a GitHub Action.
          cat <<EOF > gemini-reviewer.js
          const { context, getOctokit } = require('@actions/github');
          const { GoogleGenerativeAI } = require('@google/generative-ai');

          async function run() {
            try {
              const octokit = getOctokit(process.env.GITHUB_TOKEN);
              const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
              const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

              let contentToReview = '';
              let issueNumber = 0;
              let commentBody = '';

              if (context.eventName === 'pull_request') {
                issueNumber = context.payload.pull_request.number;
                const pr = await octokit.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issueNumber,
                });
                const prDiff = await octokit.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issueNumber,
                  mediaType: { format: 'diff' }
                });

                contentToReview = prDiff.data;
                const prompt = \`Review the following code diff for best practices, potential bugs, and provide a summary of changes.
                
                Code Diff:
                \${contentToReview}
                \`;
                
                const result = await model.generateContent(prompt);
                commentBody = result.response.text();

              } else if (context.eventName === 'issues') {
                issueNumber = context.payload.issue.number;
                contentToReview = context.payload.issue.body;
                const prompt = \`Review the following issue description and provide an initial analysis and potential solution.
                
                Issue:
                \${contentToReview}
                \`;

                const result = await model.generateContent(prompt);
                commentBody = result.response.text();
              }

              if (commentBody) {
                await octokit.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: \`## Gemini Automated Review\n\n\${commentBody}\`
                });
                console.log('Gemini review comment posted successfully.');
              } else {
                console.log('No content to review or API response was empty.');
              }

            } catch (error) {
              console.error(\`An error occurred: \${error.message}\`);
              throw error;
            }
          }

          run();
          EOF
          
          # Execute the script using node.
          node gemini-reviewer.js
