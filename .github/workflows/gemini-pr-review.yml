# .github/workflows/gemini-reviewer.yml
name: Gemini AI Code & Issue Reviewer

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  issues:
    types:
      - opened
      - reopened

jobs:
  review:
    # Ensure this job only runs if a `GITHUB_TOKEN` is available
    # and the event is from a pull request or issue.
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # In a real-world scenario, you might have a package.json
        # and would install dependencies here. For this script,
        # we're just installing the required packages.
        run: |
          npm install @actions/github @google/generative-ai

      - name: Run Gemini Reviewer Script
        # Corrected: Use 'node -e' to explicitly execute the script with Node.js.
        run: |
          node -e '
          const { context, getOctokit } = require("@actions/github");
          const { GoogleGenerativeAI } = require("@google/generative-ai");
          
          // Function to handle exponential backoff for API calls.
          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }
          
          async function fetchWithBackoff(func, maxRetries = 5, initialDelay = 1000) {
            for (let i = 0; i < maxRetries; i++) {
              try {
                return await func();
              } catch (error) {
                if (error.status === 429) {
                  console.warn(`Rate limit exceeded. Retrying in ${initialDelay}ms...`);
                  await sleep(initialDelay);
                  initialDelay *= 2; // Exponential backoff
                } else {
                  throw error;
                }
              }
            }
            throw new Error("Max retries exceeded.");
          }
          
          // Function to get the file content from a pull request.
          async function getFileContent(octokit, owner, repo, path, ref) {
            try {
              const { data } = await octokit.rest.repos.getContent({
                owner,
                repo,
                path,
                ref, // ref is the branch name (e.g., 'master' or 'main')
              });
              // Decode the Base64 content to a string.
              return Buffer.from(data.content, "base64").toString("utf-8");
            } catch (error) {
              console.error(`Error fetching file content for ${path}: ${error.message}`);
              return null;
            }
          }
          
          async function run() {
            try {
              const octokit = getOctokit(process.env.GITHUB_TOKEN);
              const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
              const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
          
              if (context.eventName === "pull_request") {
                const pr = context.payload.pull_request;
                const issueNumber = pr.number;
                const { owner, repo } = context.repo;
          
                console.log(`Starting review for PR #${issueNumber}...`);
                
                // Get the list of files changed in the PR
                const files = await octokit.rest.pulls.listFiles({
                  owner,
                  repo,
                  pull_number: issueNumber,
                });
          
                const comments = [];
          
                for (const file of files.data) {
                  if (file.status === "added" || file.status === "modified") {
                    console.log(`Reviewing file: ${file.filename}`);
          
                    // Create a detailed prompt for each file.
                    const prompt = `Review the following code for best practices, potential bugs, and provide suggestions for improvement.
                      
                      File: ${file.filename}
                      Status: ${file.status}
                      
                      Code Diff:
                      \`\`\`diff
                      ${file.patch}
                      \`\`\`
                      
                      Provide a short, specific review. Focus on one or two key points. Do not provide a general summary.
                      If there are no issues, just say "Looks good."
                    `;
          
                    // Generate the review comment.
                    const result = await fetchWithBackoff(() => model.generateContent(prompt));
                    const reviewComment = result.response.text();
          
                    // Add a comment to the list for the PR review.
                    if (reviewComment && reviewComment !== "Looks good.") {
                      comments.push({
                        path: file.filename,
                        body: reviewComment,
                        // The position is relative to the start of the diff hunk. We use a simple method here.
                        // For a more advanced approach, you would need to parse the diff patch.
                        position: 1, 
                      });
                    }
                  }
                }
          
                // If there are any comments, create a PR review.
                if (comments.length > 0) {
                  await octokit.rest.pulls.createReview({
                    owner,
                    repo,
                    pull_number: issueNumber,
                    event: "COMMENT", // "COMMENT" posts comments without approving or requesting changes
                    comments,
                  });
                  console.log("Gemini review comments posted successfully.");
                } else {
                  await octokit.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    body: "## Gemini Automated Review\n\nLooks good! I found no immediate issues with this pull request."
                  });
                  console.log("Gemini review: No issues found. A final summary comment was posted.");
                }
          
              } else if (context.eventName === "issues") {
                const issue = context.payload.issue;
                const issueNumber = issue.number;
                const { owner, repo } = context.repo;
          
                console.log(`Starting analysis for Issue #${issueNumber}...`);
                
                const prompt = `Analyze the following issue description and provide a structured, helpful reply.
                  
                  Issue Title: ${issue.title}
                  Issue Body:
                  ${issue.body}
                  
                  Provide a response in Markdown format. The response should include:
                  1. An acknowledgment of the issue.
                  2. A clear summary of the problem.
                  3. Potential root causes or areas to investigate.
                  4. A proposed solution or next steps.
                  5. Use code blocks for any code examples.
                  `;
          
                const result = await fetchWithBackoff(() => model.generateContent(prompt));
                const commentBody = result.response.text();
          
                if (commentBody) {
                  await octokit.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    body: `## Gemini Automated Review\n\n${commentBody}`
                  });
                  console.log("Gemini review comment posted successfully.");
                } else {
                  console.log("No content to review or API response was empty.");
                }
              }
          
            } catch (error) {
              console.error(`An error occurred: ${error.message}`);
              throw error;
            }
          }
          
          run();
          '
