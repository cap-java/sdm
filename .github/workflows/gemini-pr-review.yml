name: Gemini AI Code & Issue Reviewer

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  issues:
    types:
      - opened
      - reopened

jobs:
  review:
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install @actions/github @google/generative-ai

      - name: Run Gemini Reviewer Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/review.js
