name: Gemini AI Comment Responder

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    if: github.event.comment.author.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini Responder Script
        uses: actions/github-script@v6
        with:
          script: |
            // Import the review.js script
            const { run } = require('./.github/scripts/review.js');
            // Execute the main function from the script
            await run();
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
