name: Gemini AI Comment Responder

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    # Ensure this job only runs for PR comments and not from the bot itself
    if: github.event.issue.pull_request && github.event.comment.author.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd .github/scripts
          npm install

      - name: Run AI Responder Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AICORE_SERVICE_KEY: ${{ secrets.AICORE_SERVICE_KEY }}
        run: |
          cd .github/scripts
          node review.js
