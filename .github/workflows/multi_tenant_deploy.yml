name: Build Cloud Cap Samples Java

on:
  push:
    branches: [multi_tenant_deploy]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout this repository
      uses: actions/checkout@v2

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install MBT
      run: npm install -g mbt

    - name: Set up Maven settings
      env:
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      run: |
        mkdir -p $HOME/.m2
        cat <<EOF > $HOME/.m2/settings.xml
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
           <profiles>
              <profile>
                 <id>release.build</id>
                 <pluginRepositories>
                    <pluginRepository>
                       <id>artifactory</id>
                       <url>https://int.repositories.cloud.sap/artifactory/build-releases/</url>
                    </pluginRepository>
                 </pluginRepositories>
                 <repositories>
                    <repository>
                       <id>artifactory</id>
                       <url>https://int.repositories.cloud.sap/artifactory/build-releases/</url>
                    </repository>
                 </repositories>
                 <properties>
                    <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
                    <tycho.localArtifacts>ignore</tycho.localArtifacts>
                 </properties>
              </profile>
              <profile>
                 <id>milestone.build</id>
                 <pluginRepositories>
                    <pluginRepository>
                       <id>artifactory</id>
                       <url>https://int.repositories.cloud.sap/artifactory/build-milestones/</url>
                    </pluginRepository>
                 </pluginRepositories>
                 <repositories>
                    <repository>
                       <id>artifactory</id>
                       <url>https://int.repositories.cloud.sap/artifactory/build-milestones/</url>
                    </repository>
                 </repositories>
                 <properties>
                    <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
                    <tycho.localArtifacts>ignore</tycho.localArtifacts>
                 </properties>
              </profile>
              <profile>
                 <id>snapshot.build</id>
                 <pluginRepositories>
                    <pluginRepository>
                       <id>artifactory</id>
                       <url>https://int.repositories.cloud.sap/artifactory/build-snapshots/</url>
                    </pluginRepository>
                 </pluginRepositories>
                 <repositories>
                    <repository>
                       <id>cap-java</id>
                       <url>https://int.repositories.cloud.sap/artifactory/proxy-cap-java/</url>
                    </repository>
                    <repository>
                       <id>artifactory</id>
                       <url>https://int.repositories.cloud.sap/artifactory/build-snapshots/</url>
                    </repository>
                    <repository>
                       <id>cap-sdm-java</id>
                       <url>https://int.repositories.cloud.sap/artifactory/proxy-cap-sdm-java/</url>
                    </repository>
                 </repositories>
                 <properties>
                    <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
                    <tycho.localArtifacts>ignore</tycho.localArtifacts>
                 </properties>
              </profile>
              <profile>
                 <id>sonar</id>
                 <activation>
                    <activeByDefault>true</activeByDefault>
                 </activation>
                 <properties>
                    <sonar.host.url>https://sonar.tools.sap</sonar.host.url>
                    <tycho.disableP2Mirrors>true</tycho.disableP2Mirrors>
                    <tycho.localArtifacts>ignore</tycho.localArtifacts>
                 </properties>
              </profile>
           </profiles>
           <activeProfiles>
              <activeProfile>snapshot.build</activeProfile>
           </activeProfiles>
           <pluginGroups>
              <pluginGroup>com.sap.ldi</pluginGroup>
           </pluginGroups>
        </settings>
        EOF

    - name: Clone the cloud-cap-samples-java repo
      run: git clone --depth 1 --branch main https://github.com/vibhutikumar07/cloud-cap-samples-java.git

    - name: Run mbt build
      working-directory: cloud-cap-samples-java
      run: mbt build
