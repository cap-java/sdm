      - name: Set up Java 17 ☕
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache CF CLI 📦
        id: cache-cf-cli
        uses: actions/cache@v4
        with:
          path: /usr/bin/cf8
          key: cf-cli-v8-${{ runner.os }}

