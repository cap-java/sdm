          echo "::add-mask::$username"
          echo "::add-mask::$password"
          echo "::add-mask::$noSDMRoleUsername"
          echo "::add-mask::$noSDMRoleUserPassword"
          echo "::add-mask::$versionedRepositoryID"
          echo "::add-mask::$virusScanRepositoryID"
