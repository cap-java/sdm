          PROPERTIES_FILE="sdm/src/test/resources/credentials.properties"
          appUrl="${{ secrets.CF_ORG }}-${{ steps.determine_space.outputs.space }}-demoappjava-srv.cfapps.eu12.hana.ondemand.com"
