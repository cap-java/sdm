          fi
          escapedCmisClientSecret=$(echo "$cmis_client_secret" | sed 's/\$/\\$/g')
          echo "::add-mask::$escapedCmisClientSecret"
          cmis_client_id=$(echo "$binding_details" | jq -r '.credentials.clientid')
          if [ -z "$cmis_client_id" ] || [ "$cmis_client_id" == "null" ]; then
