name: AI Changelog Generator

# Triggers on every GitHub Release event — both pre-release (Artifactory) and
# full release (Maven Central) so CHANGELOG.md is always updated before the
# artifacts land in the registries.
on:
  release:
    types: [prereleased, released]

permissions:
  contents: write      # needed to commit + push CHANGELOG.md to develop
  pull-requests: read  # needed to list merged PRs for the changelog entry

jobs:
  generate-changelog:
    name: Generate & Commit CHANGELOG.md
    runs-on: ubuntu-latest

    steps:
      # Checkout develop (not the tag) so we can commit back to the branch.
      # fetch-depth: 0 is required to compare tags via the GitHub API calls
      # inside the script.
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-changelog-${{ hashFiles('.github/scripts/generate-changelog.js') }}
          restore-keys: |
            ${{ runner.os }}-changelog-

      - name: Install dependencies
        run: npm install @actions/github @google/generative-ai

      - name: Generate CHANGELOG entry via Gemini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/generate-changelog.js

      # Commit only if CHANGELOG.md was actually modified (idempotent).
      # `git pull --rebase` prevents conflicts with the concurrent version-bump
      # commit from the newrelease action running in the build workflow.
      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git diff --cached --quiet && echo "No CHANGELOG changes to commit." && exit 0
          git commit -m "docs(changelog): auto-update for ${{ github.event.release.tag_name }}"
          git pull --rebase origin develop
          git push origin develop
