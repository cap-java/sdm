name: Build Doctor 🩺

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of a failed workflow to analyze'
        required: true
        default: '21935724752'
  push:
    branches:
      - feature/test-build-doctor

jobs:
  diagnose-failure:
    runs-on: ubuntu-latest
    # if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @actions/github @google/generative-ai @octokit/core

      - name: Run Build Doctor Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKFLOW_RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || 'Manual Trigger' }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: node .github/scripts/analyze-failure.js
