name: Integration Test

on:
  push:
    branches:
      - Integration_Test
  pull_request:
    branches:
      - Integration_Test
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Run integration tests
        run: |
          set -e  # Enable error checking

          # Gather secrets and other values
          appUrl="${{ secrets.CF_ORG }}-${{ secrets.CF_SPACE }}-demoappjava-srv.cfapps.eu12.hana.ondemand.com"
          authUrl="${{ secrets.CAPAUTH_URL }}"
          clientID="${{ secrets.CAPSDM_CLIENT_ID }}"
          clientSecret="${{ secrets.CAPSDM_CLIENT_SECRET }}"
          username="${{ secrets.CF_USER }}"
          password="${{ secrets.CF_PASSWORD }}"

          # Ensure all required variables are set
          if [ -z "$appUrl" ]; then echo "Error: appUrl is not set"; exit 1; fi
          if [ -z "$authUrl" ]; then echo "Error: authUrl is not set"; exit 1; fi
          if [ -z "$clientID" ]; then echo "Error: clientID is not set"; exit 1; fi
          if [ -z "$clientSecret" ]; then echo "Error: clientSecret is not set"; exit 1; fi
          if [ -z "$username" ]; then echo "Error: username is not set"; exit 1; fi
          if [ -z "$password" ]; then echo "Error: password is not set"; exit 1; fi

          # Function to partially mask sensitive information for logging
          mask() {
            local value="$1"
            if [ ${#value} -gt 6 ]; then
              echo "${value:0:3}*****${value: -3}"
            else
              echo "${value:0:2}*****"
            fi
          }

          # Print masked versions of the credentials for debugging
          echo "App URL: $appUrl"
          echo "Auth URL: $(mask "$authUrl")"
          echo "Client ID: $(mask "$clientID")"
          echo "Client Secret: $(mask "$clientSecret")"
          echo "Username: $(mask "$username")"
          echo "Password: $(mask "$password")"

          # Properties file path
          PROPERTIES_FILE="sdm/src/test/resources/credentials.properties"

          # Modify properties file with jq using real values
          jq -n \
            --arg appUrl "$appUrl" \
            --arg authUrl "$authUrl" \
            --arg clientID "$clientID" \
            --arg clientSecret "$clientSecret" \
            --arg username "$username" \
            --arg password "$password" \
            '{
              "appUrl": $appUrl,
              "authUrl": $authUrl,
              "clientID": $clientID,
              "clientSecret": $clientSecret,
              "username": $username,
              "password": $password
            }' > "$PROPERTIES_FILE" \
            || { echo "Failed to update properties file"; exit 1; }

          # Print the masked credentials JSON (without actual values)
          echo "Contents of $PROPERTIES_FILE (masked):"
          jq '. | {appUrl: .appUrl, authUrl: "***", clientID: "***", clientSecret: "***", username: "***", password: "***"}' "$PROPERTIES_FILE"

          # Run Maven integration tests
          mvn clean verify -P integration-tests -DskipUnitTests || { echo "Maven tests failed"; exit 1; }
