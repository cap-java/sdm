name: Integration Test

on:
  push:
    branches:
      - Integration_Test
  pull_request:
    branches:
      - Integration_Test
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Run integration tests
        run: |
          appUrl="${{ secrets.CF_ORG }}-${{ secrets.CF_SPACE }}-demoappjava-srv.cfapps.eu12.hana.ondemand.com"
          authUrl="${{ secrets.CAPAUTH_URL }}"
          clientID="${{ secrets.CAPSDM_CLIENT_ID }}"
          clientSecret="${{ secrets.CAPSDM_CLIENT_SECRET }}"
          username="${{ secrets.CF_USER }}"
          password="${{ secrets.CF_PASSWORD }}"

          # Helper function to mask credentials
          mask() {
            echo "${1:0:3}*****"
          }

          echo "App URL: $appUrl"
          echo "Auth URL: $(mask "$authUrl")"
          echo "Client ID: $(mask "$clientID")"
          echo "Client Secret: $(mask "$clientSecret")"
          echo "Username: $(mask "$username")"
          echo "Password: $(mask "$password")"

          # Properties file path
          PROPERTIES_FILE="sdm/src/test/resources/credentials.properties"

          # Modify properties file
          jq --arg appUrl "$appUrl" --arg authUrl "$authUrl" --arg clientID "$clientID" --arg clientSecret "$clientSecret" --arg username "$username" --arg password "$password" \
          '.appUrl = $appUrl | .authUrl = $authUrl | .clientID = $clientID | .clientSecret = $clientSecret | .username = $username | .password = $password' "$PROPERTIES_FILE" > "temp.properties" \
          && mv "temp.properties" "$PROPERTIES_FILE"
          
          # Print the modified properties file
          cat "$PROPERTIES_FILE"
          
          # Run Maven integration tests
          mvn clean verify -P integration-tests -DskipUnitTests
