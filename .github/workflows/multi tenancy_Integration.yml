            space="${{ github.event.inputs.cf_space }}"
          fi
          echo "space=$space" >> $GITHUB_OUTPUT

      - name: Login to Cloud Foundry 🔑
        run: |
          cf login -a ${{ secrets.CF_API }} \
            -u ${{ secrets.CF_USER }} \
            -p ${{ secrets.CF_PASSWORD }} \
            -o ${{ secrets.CF_ORG }} \
            -s ${{ steps.determine_space.outputs.space }}

      - name: Switch to Virus Scan Repository 🔄
        run: |
          echo "🔄 Switching REPOSITORY_ID to virus scan repository..."
          cf set-env bookshop-mt-srv REPOSITORY_ID "${{ secrets.VIRUSSCANREPOSITORYID }}"
          echo "🔄 Restaging application..."
          cf restage bookshop-mt-srv > /dev/null 2>&1
          echo "✅ Switched to virus scan repository!"

  virusscan-integration-test:
    runs-on: ubuntu-latest
    needs: virusscan-repo-setup
    if: "!cancelled() && needs.virusscan-repo-setup.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        tokenFlow: [namedUser, technicalUser]
        tenant: [TENANT1, TENANT2]
        testClass:
          - IntegrationTest_SingleFacet_Virus
          - IntegrationTest_MultipleFacet_Virus
          - IntegrationTest_Chapters_MultipleFacet_Virus
    env:
      FILE_URL: ${{ 'http://www.eicar.org/download/eicar.com.txt' }}
      DOWNLOAD_PATH: ${{ 'sdm/eicar.com.txt' }}
    steps:
      - name: Checkout repository 📁
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch_name }}

      - name: Set up Java 17 ☕
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache CF CLI 📦
        id: cache-cf-cli
        uses: actions/cache@v4
        with:
          path: /usr/bin/cf8
          key: cf-cli-v8-${{ runner.os }}

      - name: Install Cloud Foundry CLI 🔧
