  # Revert repository to default after virus scan tests
  # Runs if either versioned-test or virusscan-test ran (since either switches the repo)
  virusscan-cleanup:
    runs-on: ubuntu-latest
    needs: [versioned-test, virusscan-test]
    if: always() && (needs.versioned-test.result != 'skipped' || needs.virusscan-test.result != 'skipped')
    steps:
      - name: Cache CF CLI 📦
        id: cache-cf-cli
        uses: actions/cache@v4
        with:
          path: /usr/bin/cf8
          key: cf-cli-v8-${{ runner.os }}

      - name: Install Cloud Foundry CLI 🔧
        if: steps.cache-cf-cli.outputs.cache-hit != 'true'
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install cf8-cli

      - name: Install jq 📦
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - name: Determine Cloud Foundry Space 🌌
        id: determine_space
        run: |
          if [ "${{ github.event.inputs.cf_space }}" == "developcap" ]; then
            space="${{ secrets.CF_SPACE }}"
          else
            space="${{ github.event.inputs.cf_space }}"
          fi
          echo "space=$space" >> $GITHUB_OUTPUT

      - name: Login to Cloud Foundry 🔑
        run: |
          cf login -a ${{ secrets.CF_API }} \
            -u ${{ secrets.CF_USER }} \
            -p ${{ secrets.CF_PASSWORD }} \
            -o ${{ secrets.CF_ORG }} \
            -s ${{ steps.determine_space.outputs.space }}

      - name: Revert to Default Repository 🔄
        run: |
          echo "🔄 Reverting REPOSITORY_ID to default repository..."
          cf set-env bookshop-mt-srv REPOSITORY_ID "${{ secrets.DEFAULTREPOSITORYIDMT }}"
          echo "🔄 Restaging application..."
          cf restage bookshop-mt-srv > /dev/null 2>&1
          echo "✅ Reverted to default repository!"

