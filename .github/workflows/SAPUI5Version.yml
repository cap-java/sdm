name: Daily SAPUI5 Version Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-version:
    name: Check and Update SAPUI5 Version
    runs-on: ubuntu-latest
    
    # Best practice: Set permissions to minimum required
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout the develop_deploy branch
        # Best practice: Pin to a specific major version
        uses: actions/checkout@v4
        with:
          ref: develop_deploy

      - name: Get and parse versions
        id: get_versions
        uses: actions/github-script@v7
        with:
          script: |
            const sapui5Url = 'https://sapui5.hana.ondemand.com/resources/sap-ui-version.json';
            const filePath = 'cap-notebook/demoapp/app/index.html';

            // 1. Get latest SAPUI5 version with proper error handling
            let latestVersion;
            try {
              const response = await fetch(sapui5Url);
              if (!response.ok) {
                throw new Error(`Failed to fetch SAPUI5 version. Status: ${response.status}`);
              }
              const data = await response.json();
              if (!data.version) {
                throw new Error('Could not find a version field in the API response.');
              }
              latestVersion = data.version;
              console.log(`Latest SAPUI5 version found: ${latestVersion}`);
            } catch (error) {
              core.setFailed(`Error getting latest SAPUI5 version: ${error.message}`);
              return;
            }

            // 2. Get current version from file
            const fs = require('fs').promises;
            let currentVersion;
            try {
              const fileContent = await fs.readFile(filePath, 'utf8');
              const match = fileContent.match(/https:\/\/ui5.sap.com\/(.*?)\/resources\/sap-ui-core.js/);
              if (!match || match.length < 2) {
                throw new Error('Could not find current SAPUI5 version in the file.');
              }
              currentVersion = match[1];
              console.log(`Current SAPUI5 version in file: ${currentVersion}`);
            } catch (error) {
              core.setFailed(`Error getting current version from file: ${error.message}`);
              return;
            }

            // 3. Compare versions using a safe method
            const compareVersions = (v1, v2) => {
              const parts1 = v1.split('.').map(Number);
              const parts2 = v2.split('.').map(Number);
              for (let i = 0; i < Math.max(parts1.length, parts2.length); i++) {
                const num1 = parts1[i] || 0;
                const num2 = parts2[i] || 0;
                if (num1 > num2) return 1;
                if (num1 < num2) return -1;
              }
              return 0;
            };

            const comparison = compareVersions(latestVersion, currentVersion);
            
            // Set output variables
            core.setOutput('latest_version', latestVersion);
            core.setOutput('current_version', currentVersion);
            core.setOutput('is_newer', comparison > 0);

      - name: Update version in file
        id: update_version_file
        if: steps.get_versions.outputs.is_newer == 'true'
        run: |
          echo "A newer version of SAPUI5 is available. Updating..."
          FILE_PATH='cap-notebook/demoapp/app/index.html'
          LATEST_VERSION=${{ steps.get_versions.outputs.latest_version }}
          CURRENT_VERSION=${{ steps.get_versions.outputs.current_version }}
          
          # A safer, more targeted find and replace
          sed -i "s|https:\/\/ui5.sap.com\/${CURRENT_VERSION}|https:\/\/ui5.sap.com\/${LATEST_VERSION}|g" "$FILE_PATH"

          echo "Update successful."

      - name: Create Pull Request
        if: steps.update_version_file.outcome == 'success'
        # Best practice: Pin to a specific major version
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GIT_TOKEN }}
          commit-message: 'chore: Update SAPUI5 to ${{ steps.get_versions.outputs.latest_version }}'
          title: 'Automated: Update SAPUI5 to ${{ steps.get_versions.outputs.latest_version }}'
          body: |
            This is an automated pull request to update the SAPUI5 version in `index.html`.
            - Current Version: ${{ steps.get_versions.outputs.current_version }}
            - Latest Version: ${{ steps.get_versions.outputs.latest_version }}
          branch: 'update-sapui5-version'
          base: develop_deploy
