# This workflow responds to comments containing "@gemini-cli" on PRs and issues.

name: Gemini CLI Comment Handler

on:
  # This workflow is triggered whenever a new comment is created.
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    
    # We need to grant permissions for the workflow to read the comment
    # and to write a new comment.
    permissions:
      contents: read
      issues: write
    
    # This job will only run if the comment body starts with "@gemini-cli".
    if: startsWith(github.event.comment.body, '@gemini-cli')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # This step will install the dependencies for our custom script.
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install @actions/github @google/generative-ai

      # This is the custom script that interacts with the Gemini API
      # and posts the response back as a new comment.
      - name: Run Gemini CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Save the script to a file and execute it with 'node'.
          cat <<EOF > gemini-cli.js
          const { context, getOctokit } = require('@actions/github');
          const { GoogleGenerativeAI } = require('@google/generative-ai');

          async function run() {
            try {
              const octokit = getOctokit(process.env.GITHUB_TOKEN);
              const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
              const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

              const comment = context.payload.comment.body;
              const issueNumber = context.payload.issue.number;

              // Extract the user's query from the comment.
              const userQuery = comment.replace('@gemini-cli', '').trim();
              
              if (!userQuery) {
                console.log('Query is empty after removing "@gemini-cli".');
                return;
              }

              const prompt = \`Respond to the following query from a user.
              
              Query:
              \${userQuery}
              \`;

              const result = await model.generateContent(prompt);
              const commentBody = result.response.text();

              if (commentBody) {
                await octokit.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: \`## Gemini CLI Response\n\n\${commentBody}\`
                });
                console.log('Gemini response comment posted successfully.');
              } else {
                console.log('API response was empty.');
              }

            } catch (error) {
              console.error(\`An error occurred: \${error.message}\`);
              throw error;
            }
          }

          run();
          EOF
          
          # Execute the script using node.
          node gemini-cli.js
