version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "some-dependency-not-to-monitor" # Example, replace with actual unwanted dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    allow:
      - dependency-name: "com.sap.cds/cds-services-bom"
      - dependency-name: "com.sap.cloud.sdk/sdk-bom"
      - dependency-name: "org.sonatype.central"
